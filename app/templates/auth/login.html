{% extends "base_public.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="auth-wrap auth-wrap--center">
  {% with action = url_for('auth.login'), autofocus = true %}
    {% include "partials/login_form.html" %}
  {% endwith %}
</div>
{% endblock %}

{% block scripts %}
<script nonce="{{ csp_nonce }}">
  (function () {
    // Sur Android / tablette tactile : pas de clavier virtuel ouvert d'office,
    // il masquerait le bouton « Se connecter ». Le focus reste automatique sur ordinateur.
    var field = document.querySelector("[data-autofocus]");
    var touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (field && !touch) {
      try { field.focus(); } catch (e) {}
    }
    // Retour arrière depuis le navigateur : on réactive le bouton de connexion
    window.addEventListener("pageshow", function () {
      document.querySelectorAll("form .btn.is-loading, form .btn[disabled]").forEach(function (btn) {
        btn.disabled = false;
        btn.classList.remove("is-loading");
        btn.removeAttribute("aria-busy");
      });
    });
  })();
</script>
{% endblock %}
