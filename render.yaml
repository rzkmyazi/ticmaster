# ============================================================================
# Blueprint Render — TIC MASTER (#by_Myazirzk)
# Documentation : https://render.com/docs/blueprint-spec
#
# Au premier déploiement, `python seed.py bootstrap` crée les tables, le
# SUPER ADMIN, les 12 modules et les 69 questions. L'opération est idempotente :
# elle ne recharge rien et ne modifie jamais un mot de passe existant.
# ============================================================================
databases:
  - name: ticmaster-db
    databaseName: ticmaster
    user: ticmaster
    plan: free
    region: frankfurt

services:
  - type: web
    name: ticmaster
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py bootstrap && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /sante
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ticmaster-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "1"
      - key: AUTH_SESSION_HOURS
        value: "8"
      - key: LOGIN_MAX_ATTEMPTS
        value: "8"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      # Connexions simultanées : seules les erreurs comptent (une classe entière
      # derrière la même adresse IP peut travailler sans être bloquée).
      - key: LOGIN_IP_MAX_ATTEMPTS
        value: "40"
      - key: LOGIN_IP_WINDOW_MINUTES
        value: "10"
      - key: PRESENCE_ONLINE_SECONDS
        value: "120"
      - key: MAX_CONTENT_MB
        value: "30"
      - key: SITE_NAME
        value: TIC MASTER
      # --- Premier super administrateur -----------------------------------
      - key: SUPER_ADMIN_USERNAME
        value: Myazirzk
      # À saisir dans le formulaire de création du Blueprint (non versionné).
      # Laissé vide : un mot de passe aléatoire est généré et affiché une seule
      # fois dans les journaux du service.
      - key: SUPER_ADMIN_PASSWORD
        sync: false
